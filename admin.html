<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>翻牌記憶王｜主控室</title></head><body><main class="wrap"><div class="hero"><h1>👑 翻牌記憶王｜主控室</h1><p>動動腦・找配對・成為記憶王！</p></div><div class="grid2"><section class="panel"><h2>⚙️ 房間管理</h2><div class="controls"><button id="newRoom">＋ 產生新房號</button><button id="start">▶ 開始遊戲</button><button id="copyUrl" class="secondary">🔗 複製玩家網址</button><button id="copyShare" class="secondary">📋 複製分享文字</button><button id="del" class="danger">🗑 刪除房間</button></div><p id="copyMsg" class="copymsg"></p><h3>房號：<span id="code">尚未建立</span></h3><div class="controls"><label>題型<select id="type"><option value="farm">🌱 種菜素材</option><option value="idiom">🀄 成語</option><option value="poem">📜 唐詩</option></select></label><label>內容難度<select id="difficulty"><option>簡單</option><option>中等</option><option>困難</option></select></label><label>盤面大小<select id="boardSize"><option value="4x4" selected>4 × 4（16張）</option><option value="6x6">6 × 6（36張）</option><option value="8x8">8 × 8（64張）</option></select></label><label>開始倒數<select id="startCountdown"><option>5</option><option selected>10</option><option>15</option><option>20</option><option>30</option><option>45</option><option>60</option></select></label><label>遊戲時間<select id="gameMinutes"><option value="unlimited">♾ 無限制</option><option value="1">1 分鐘</option><option value="3" selected>3 分鐘</option><option value="5">5 分鐘</option><option value="10">10 分鐘</option><option value="15">15 分鐘</option><option value="20">20 分鐘</option><option value="30">30 分鐘</option></select></label><label>完成條件<select id="finishGoal"><option value="1">第一位完成</option><option value="3">前三位完成</option><option value="5">前五位完成</option><option value="10">前10位完成</option><option value="all">♾ 無限制／全部玩完</option></select></label></div><div class="schedulebox"><label class="checkline"><input id="useScheduledStart" type="checkbox"> 使用開賽日期＋時間</label><input id="scheduledAt" type="datetime-local" disabled></div><label style="margin-top:11px">備註<textarea id="note" rows="3" placeholder="例如：前三名有獎"></textarea></label><button id="save" style="margin-top:10px">💾 儲存設定</button><p id="saved" class="status"></p></section><section class="panel statuspanel"><h2>🎮 遊戲狀態</h2><div class="statusbox"><span>遊戲狀態</span><b id="state">尚未建立房間</b></div><div class="statusgrid"><div><span>👥 線上人數</span><b id="count">0</b></div><div><span>⏱ 開始倒數</span><b id="startTimer">--</b></div><div><span>⌛ 遊戲剩餘</span><b id="gameTimer">--:--</b></div></div><p class="small">玩家盤面、翻牌、配對與動畫都由玩家自己的手機處理；伺服器只同步必要成績資料。</p></section></div><section class="panel"><div class="rankhead"><h2>🏆 即時排行榜</h2><button id="copyRank" class="secondary compact">📋 複製排行榜</button></div><p id="rankMsg" class="copymsg"></p><table class="ranking"><thead><tr><th>排名</th><th>玩家</th><th>分數</th><th>完成時間</th></tr></thead><tbody id="rank"></tbody></table></section></main><script src="/socket.io/socket.io.js"></script><script src="admin.js"></script></body></html>
