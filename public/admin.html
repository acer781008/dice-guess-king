<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>骰子猜猜王｜正式主控台</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft JhengHei",sans-serif;color:#25305b;background:linear-gradient(135deg,#251e83,#5a35b9 42%,#ff79b0);min-height:100vh}.wrap{max-width:1440px;margin:auto;padding:14px}.hero{text-align:center;color:white;padding:4px 0 10px;text-shadow:0 3px 8px #34206d}.hero h1{font-size:36px;margin:0}.card{background:rgba(255,255,255,.96);border-radius:22px;padding:16px;box-shadow:0 9px 28px rgba(25,15,80,.22);margin-bottom:10px}.hidden{display:none!important}.topbar{display:grid;grid-template-columns:1fr 1fr 1.2fr 2fr;gap:10px;margin-bottom:10px}.stat{background:#fff;border-radius:18px;padding:12px 14px;min-height:82px;box-shadow:0 5px 16px #32267833}.stat b.big{font-size:24px;display:block;margin-top:5px}.layout{display:grid;grid-template-columns:390px 1fr 330px;gap:10px;align-items:start}h2,h3{margin:0 0 10px}.sectionTitle{background:linear-gradient(90deg,#ff6cab,#7c5cff);color:#fff;padding:9px 14px;border-radius:15px;text-align:center;margin:-5px 0 12px}.settings{display:grid;grid-template-columns:1fr 1fr;gap:8px}.wide{grid-column:1/-1}label{display:block;font-weight:800;font-size:14px;margin-bottom:4px}input,select{width:100%;padding:9px;border:1px solid #d9ddf0;border-radius:11px;background:#fafbff;font-size:14px}button{border:0;border-radius:12px;padding:9px 12px;font-weight:800;cursor:pointer;font-size:14px}.primary{background:#7c5cff;color:#fff}.pink{background:#ff5c9f;color:#fff}.soft{background:#eaf1ff;color:#315fc7}.danger{background:#ef4554;color:#fff}.green{background:#42b958;color:#fff}.orange{background:#ffad17;color:#fff}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.liveGrid{display:grid;grid-template-columns:1fr 1.7fr 1fr;gap:9px}.liveBox{background:#f5f7ff;border:1px solid #dce3ff;border-radius:16px;padding:12px;text-align:center}.status{font-size:18px;font-weight:900}.timer{font-size:38px;color:#276ee8;font-weight:900;margin:8px}.dice{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;font-size:25px;margin:14px 0}.ranking .item{display:flex;justify-content:space-between;gap:10px;padding:10px 5px;border-bottom:1px solid #e8e8f5}.answerLine{font-size:12px;color:#6e5c8f;margin-top:4px}.gainLine{font-size:12px;color:#7a3cff;font-weight:800;margin-top:2px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.small{font-size:12px;color:#72778e}.online{color:#159447}.offline{color:#999}.warn{color:#d33;font-weight:700;margin-top:8px}
@media(max-width:1100px){.layout{grid-template-columns:360px 1fr}.sideRank{grid-column:1/-1}.topbar{grid-template-columns:1fr 1fr}}@media(max-width:760px){.hero h1{font-size:28px}.layout,.topbar{grid-template-columns:1fr}.settings{grid-template-columns:1fr}.wide{grid-column:auto}.liveGrid{grid-template-columns:1fr}.controls{grid-template-columns:1fr}.wrap{padding:9px}}
</style></head><body><div class="wrap"><div class="hero"><h1>👑 🎲 骰子猜猜王 🎲</h1><p>✨ 正式多人連線主控台 ✨</p></div>
<div class="card" id="login" style="max-width:560px;margin:40px auto"><h2>🔐 主控登入</h2><label>管理員密碼</label><div class="row"><input id="pw" type="password" placeholder="請輸入管理員密碼" style="flex:1"><button class="primary" id="loginBtn">進入主控室</button></div><div id="loginMsg" class="warn"></div></div>
<div id="main" class="hidden"><div class="topbar"><div class="stat">🏠 房號<b class="big" id="roomNo">------</b><button class="primary" id="newRoomBtn">🎲 產生新房號</button></div><div class="stat">👥 玩家人數<b class="big" id="playerCount">0</b></div><div class="stat">⏰ 目前狀態<b class="big" id="phaseText">等待開始</b></div><div class="stat">🔗 分享玩家<div class="row" style="margin-top:8px"><button class="soft" id="copyLinkBtn">🔗 複製玩家連結</button><button class="soft" id="copyShareBtn">📋 複製分享文字</button></div></div></div>
<div class="layout"><div class="card"><h3 class="sectionTitle">⚙️ 遊戲設定</h3><div class="settings"><div><label>遊戲模式</label><select id="mode"><option>猜總點數</option><option>猜大小</option><option>猜單雙</option><option>猜號碼・不看順序</option><option>猜號碼・看順序</option></select></div><div><label>骰子數量</label><select id="diceCount"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></div><div><label>遊戲回合</label><select id="totalRounds"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></div><div><label>開賽時間</label><input id="startAt" type="datetime-local"></div><div><label>開賽前倒數</label><select id="preSeconds"></select></div><div><label>每回合作答</label><select id="answerSeconds"></select></div><div><label>下一回合倒數</label><select id="betweenSeconds"><option>3</option><option selected>5</option><option>10</option><option>15</option></select></div><div id="numberPointWrap"><label>每猜中 1 顆</label><input id="numberPoint" type="number" min="1" value="10"></div><div class="wide"><label>📝 備註</label><input id="note" maxlength="120" placeholder="例如：今晚準時開賽"></div></div><button class="primary" id="saveSettingsBtn" style="width:100%;margin-top:9px">💾 儲存設定</button><div id="settingsMsg" class="small" style="margin-top:8px"></div></div>
<div><div class="card"><h3 class="sectionTitle">🎮 即時遊戲區</h3><div class="liveGrid"><div class="liveBox">🔄 目前回合<div class="timer" id="roundText">0 / 10</div></div><div class="liveBox">🎲 本回合骰子<div class="dice" id="diceText">🎲 🎲 🎲</div><b id="resultText">等待開獎</b></div><div class="liveBox">⏱️ 倒數<div class="timer" id="timerText">—</div><div>模式：<b id="modeText">猜總點數</b></div></div></div><div class="controls"><button class="green" id="startBtn">▶ 開始遊戲</button><button class="orange" id="pauseBtn">⏸ 暫停 / 繼續</button><button class="danger" id="endBtn">⏹ 結束遊戲</button></div></div></div>
<div class="card sideRank"><div class="row" style="justify-content:space-between"><h3 id="rankTitle">👥 即時排行榜</h3><button class="soft" id="copyRankBtn">📋 複製排行榜</button></div><div class="ranking" id="ranking"><div class="small">尚無玩家</div></div></div></div></div></div>
<script src="/socket.io/socket.io.js"></script><script>
const socket=io(); const $=id=>document.getElementById(id); let ROOM=localStorage.getItem('DGK_ADMIN_ROOM')||''; let ADMIN_TOKEN=localStorage.getItem('DGK_ADMIN_TOKEN')||''; let S=null;
for(let i=5;i<=60;i+=5)$('preSeconds').insertAdjacentHTML('beforeend',`<option ${i===10?'selected':''}>${i}</option>`);for(let i=1;i<=15;i++)$('answerSeconds').insertAdjacentHTML('beforeend',`<option ${i===10?'selected':''}>${i}</option>`);
function playerUrl(){return `${location.origin}/player.html?room=${ROOM}`}
function rankArray(){return [...(S?.players||[])].sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name))}
function fmtAnswer(a){
  if(a==null||a==='') return '尚未作答';
  return Array.isArray(a)?a.join(' ＞ '):String(a);
}
function formSettings(){return {mode:$('mode').value,diceCount:+$('diceCount').value,totalRounds:+$('totalRounds').value,startAt:$('startAt').value,preSeconds:+$('preSeconds').value,answerSeconds:+$('answerSeconds').value,betweenSeconds:+$('betweenSeconds').value,numberPoint:+$('numberPoint').value,note:$('note').value.trim()}}
function fillForm(){if(!S)return;const s=S.settings;$('mode').value=s.mode;$('diceCount').value=s.diceCount;$('totalRounds').value=s.totalRounds;$('startAt').value=s.startAt||'';$('preSeconds').value=s.preSeconds;$('answerSeconds').value=s.answerSeconds;$('betweenSeconds').value=s.betweenSeconds;$('numberPoint').value=s.numberPoint;$('note').value=s.note||'';$('numberPointWrap').style.display=s.mode.startsWith('猜號碼')?'block':'none'}
function render(){if(!S)return;$('roomNo').textContent=ROOM;$('playerCount').textContent=S.players.length;$('phaseText').textContent=S.paused?'⏸ 已暫停':S.phase;$('roundText').textContent=`${S.round} / ${S.settings.totalRounds}`;$('timerText').textContent=S.remaining??'—';$('modeText').textContent=S.settings.mode;$('diceText').textContent=S.dice.length?S.dice.map(v=>`🎲 ${v}`).join('   '):Array(S.settings.diceCount).fill('🎲').join(' ');$('resultText').textContent=S.result?`結果：${S.result}`:'等待開獎';$('rankTitle').textContent=S.status==='ended'?'🏆 即時排行榜':'👥 即時排行榜';const r=rankArray();$('ranking').innerHTML=r.length?r.map((p,i)=>{
  const ans=p.answered?`🎯 已選：${fmtAnswer(p.answer)}`:'⏳ 尚未作答';
  const gain=(S.phase==='公布答案'||S.status==='ended')?`<div class="gainLine">本回合 +${p.lastGain||0} 分</div>`:'';
  return `<div class="item"><span>${['🥇','🥈','🥉'][i]||''} ${i+1} &gt; ${p.name} <small class="${p.online?'online':'offline'}">${p.online?'●':'○'}</small><div class="answerLine">${ans}</div>${gain}</span><b>${p.score}分</b></div>`;
}).join(''):'<div class="small">尚無玩家</div>';fillForm()}
function login(){socket.emit('admin:login',{password:$('pw').value,room:ROOM,adminToken:ADMIN_TOKEN},res=>{if(!res.ok){$('loginMsg').textContent=res.error;return}ROOM=res.room;ADMIN_TOKEN=res.adminToken;S=res.state;localStorage.setItem('DGK_ADMIN_ROOM',ROOM);localStorage.setItem('DGK_ADMIN_TOKEN',ADMIN_TOKEN);$('login').classList.add('hidden');$('main').classList.remove('hidden');render()})}
$('loginBtn').onclick=login;$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('mode').onchange=()=>{$('numberPointWrap').style.display=$('mode').value.startsWith('猜號碼')?'block':'none'};
$('newRoomBtn').onclick=()=>{if(!confirm('確定建立新房號？目前房間的玩家與進度不會帶過去。'))return;socket.emit('admin:new-room',{room:ROOM,adminToken:ADMIN_TOKEN},res=>{if(!res.ok)return alert(res.error);ROOM=res.room;ADMIN_TOKEN=res.adminToken;S=res.state;localStorage.setItem('DGK_ADMIN_ROOM',ROOM);localStorage.setItem('DGK_ADMIN_TOKEN',ADMIN_TOKEN);render()})};
$('saveSettingsBtn').onclick=()=>socket.emit('admin:update-settings',{room:ROOM,adminToken:ADMIN_TOKEN,settings:formSettings()},res=>{$('settingsMsg').textContent=res.ok?'✅ 設定已儲存':res.error});
$('startBtn').onclick=()=>socket.emit('admin:start',{room:ROOM,adminToken:ADMIN_TOKEN},res=>{if(!res.ok)alert(res.error)});$('pauseBtn').onclick=()=>socket.emit('admin:pause',{room:ROOM,adminToken:ADMIN_TOKEN},res=>{if(!res.ok)alert(res.error)});$('endBtn').onclick=()=>{if(confirm('確定結束本場遊戲？'))socket.emit('admin:end',{room:ROOM,adminToken:ADMIN_TOKEN},res=>{if(!res.ok)alert(res.error)})};
async function copy(t,msg){try{await navigator.clipboard.writeText(t);alert(msg)}catch(e){prompt('請複製：',t)}}$('copyLinkBtn').onclick=()=>copy(playerUrl(),'玩家連結已複製！');$('copyShareBtn').onclick=()=>{const s=S.settings;copy(`🎲 骰子猜猜王\n🔗 挑戰連結：${playerUrl()}\n🔢 房間號：${ROOM}\n🎮 遊戲模式：${s.mode}\n📅 開賽時間：${s.startAt||'尚未設定'}\n🔄 遊戲回合：${s.totalRounds} 回\n⏱️ 每回合作答時間：${s.answerSeconds} 秒\n📝 備註：${s.note||'無'}`,'分享文字已複製！')};$('copyRankBtn').onclick=()=>copy(rankArray().map((p,i)=>`${i+1} > ${p.name} > ${p.score}分`).join('\n')||'尚無玩家','排行榜已複製！');
socket.on('room:state',st=>{if(st.room===ROOM){S=st;render()}});socket.on('admin:state',st=>{if(st.room===ROOM){S=st;render()}});
</script></body></html>
