<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"><title>數字大亂鬥｜主控</title></head><body><div class="wrap">
<div class="top"><div><div class="title">數字大亂鬥｜主控</div><div class="muted small">正式多人連線 V1.2.4</div></div><div class="actions"><button id="lobby" class="btn">🏠 返回遊戲大廳</button></div></div>
<div class="grid2 compact" style="margin-top:10px"><section class="card"><div class="top"><b>房間管理</b></div><div class="room-line"><span class="room-label">房號</span><span id="code" class="room-code">尚未建立</span><button id="newRoom" class="btn room-new">🎲 產生新房號</button></div><div class="actions room-actions"><button id="copyLink" class="btn copy">🔗 複製玩家連結</button><button id="copyText" class="btn copy">📋 複製分享文字</button><button id="save" class="btn save">💾 儲存設定</button><button id="start" class="btn start">▶ 開始遊戲</button><button id="next" class="btn next">⏭ 下一回合</button><button id="end" class="btn end">⏹ 結束遊戲</button><button id="del" class="btn danger">刪除房間</button></div><p id="adminMsg" class="muted"></p></section>
<section class="card"><div class="top"><b>👥 玩家名單</b><span id="playerCount" class="pill">0 人</span></div><div id="playerList" class="player-list muted small" style="margin-top:8px">尚無玩家</div></section></div>
<section class="card compact" style="margin-top:10px"><b>遊戲設定</b><div class="formgrid compact" style="margin-top:8px">
<div class="field fixed-game"><label>遊戲名稱</label><div class="fixed-value">🔢 數字大亂鬥</div></div><div class="field"><label>盤面</label><select id="boardSize"><option value="5">5×5</option><option value="6" selected>6×6</option><option value="7">7×7</option></select></div>
<div class="field"><label>玩法</label><select id="mode"><option value="mixed">混合模式</option><option value="sum">湊數字</option><option value="multiply">乘法挑戰</option><option value="memory">記憶挑戰</option><option value="size">大小挑戰</option><option value="parity">奇偶快手</option><option value="multiple">倍數挑戰</option></select></div><div class="field"><label>模式</label><select id="teamMode"><option value="false">個人戰</option><option value="true">團隊戰</option></select></div>
<div class="field" id="teamAssignField"><label>分隊方式</label><select id="teamAssign"><option value="auto">系統自動平均</option><option value="self">玩家自行選隊</option></select></div><div class="field" id="playerLimitField"><label>團體戰總人數上限</label><select id="playerLimit"><option>4</option><option>6</option><option>8</option><option selected>10</option><option>12</option><option>14</option><option>16</option><option>18</option><option>20</option></select></div><div class="field"><label>回合方式</label><select id="roundMode"><option value="auto">自動下一回合</option><option value="manual">手動下一回合</option></select></div>
<div class="field" id="roundSecondsField"><label>自動回合秒數</label><input id="roundSeconds" type="number" min="5" value="45"></div><div class="field" id="totalRoundsField"><label>總回合數</label><input id="totalRounds" type="number" min="1" value="10"></div>
<div class="field"><label>開始倒數秒數</label><input id="startCountdown" type="number" min="0" value="5"></div><div class="field" id="gameMinutesField"><label>遊戲時間（分鐘）</label><input id="gameMinutes" type="number" min="1" value="10"></div>
<div class="field"><label>完成條件</label><select id="finishType"><option value="rounds">完成指定回合數</option><option value="time">時間到結束</option><option value="score">達到指定分數</option></select></div><div class="field" id="finishValueField"><label id="finishValueLabel">🏆 目標分數</label><input id="finishValue" type="number" min="1" value="100"></div>
<div class="field"><label>開賽日期＋時間（選用）</label><input id="scheduledAt" type="datetime-local"></div><div class="field"><label>連勝</label><select id="streak"><option value="true">開啟</option><option value="false">關閉</option></select></div>
<div class="field full"><label>備註／公告</label><textarea id="note" rows="2" placeholder="玩家等待頁顯示"></textarea></div></div></section>
<section class="card" style="margin-top:10px"><div class="top"><div><b>🏆 即時排行榜</b><div class="muted small">只有「刪除房間」才會清除排行榜與戰績</div></div><button id="copyRank" class="btn copy">📋 複製排行榜</button></div><div id="teams" class="team hidden"></div><table class="lb"><thead><tr><th>名次</th><th>玩家</th><th>分數</th><th>最高連勝</th><th>隊伍</th><th>狀態</th></tr></thead><tbody id="rankBody"></tbody></table></section>
</div><div id="adminCountdown" class="countdown hidden card"></div><script src="/socket.io/socket.io.js"></script><script src="admin.js"></script></body></html>
