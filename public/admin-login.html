<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"><title>主控登入</title></head><body><div class="wrap"><div class="card login"><div class="title">數字大亂鬥｜主控登入</div><p class="muted">輸入主控密碼後直接進管理頁。</p><form id="f"><div class="field"><label>主控密碼</label><input id="pw" type="password" autocomplete="current-password" required></div><br><button class="btn primary" style="width:100%">登入管理</button><p id="msg" class="muted"></p></form></div></div><script>f.onsubmit=async e=>{e.preventDefault();const password=pw.value;const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})}).then(x=>x.json());if(r.ok){sessionStorage.setItem('nb_admin_pw',password);location.href='admin.html'}else msg.textContent='密碼錯誤';}</script></body></html>
