<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>骰子猜猜王｜玩家</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft JhengHei",sans-serif;color:#333;background:linear-gradient(135deg,#2a2088,#5d3bbd 43%,#ff79b0);min-height:100vh}.wrap{position:relative;z-index:1;max-width:760px;margin:auto;padding:16px}.card{background:rgba(255,255,255,.96);border-radius:22px;padding:20px;box-shadow:0 8px 26px rgba(0,0,0,.18);margin:14px 0}.hidden{display:none!important}h1{text-align:center;color:#fff;text-shadow:0 3px 8px rgba(30,20,100,.65);font-size:34px}.pill{display:inline-block;background:#fff0dc;padding:8px 12px;border-radius:999px;font-weight:700;margin:3px}.row{display:flex;gap:10px;flex-wrap:wrap}.info{display:flex;gap:8px;flex-wrap:wrap}input{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;font-size:16px}button{border:0;border-radius:14px;padding:11px 14px;font-weight:700;cursor:pointer}.primary{background:#ff8b4d;color:#fff}.choice{background:#fff1e6;border:2px solid transparent}.choice.sel{border-color:#ff8b4d;background:#ffe2c9}.small{font-size:13px;color:#777}.timer{font-size:38px;font-weight:900;text-align:center}.phase{text-align:center;font-size:22px;font-weight:800}.dice{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:15px 0}.die{width:64px;height:64px;border-radius:14px;background:#fff;border:2px solid #222;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;box-shadow:0 5px 12px rgba(0,0,0,.12)}.result{text-align:center;font-size:26px;font-weight:900}.picked{margin:12px 0;padding:12px 14px;border-radius:14px;background:#fff4d8;border:1px solid #ffd68a;text-align:center;font-weight:800}.gain{margin-top:8px;color:#7a3cff;font-size:18px;font-weight:900;text-align:center}.ranking .item{display:flex;justify-content:space-between;padding:10px 4px;border-bottom:1px solid #eee}.you{background:#fff5cf;border-radius:10px;padding:4px}.err{color:#d33;font-weight:700;margin-top:8px}@media(max-width:520px){.wrap{padding:10px}.die{width:54px;height:54px}.timer{font-size:32px}}
</style></head><body><div class="wrap"><h1>🎲 骰子猜猜王</h1><div id="login" class="card"><h2>加入遊戲</h2><div class="info"><span class="pill">🔢 房間：<b id="roomNo">------</b></span><span class="pill">🎮 <b id="loginMode">—</b></span><span class="pill">🔄 <b id="loginRounds">—</b></span></div><p>📅 開賽時間：<span id="loginStart">—</span></p><p>📝 備註：<span id="loginNote">無</span></p><label>遊戲名稱</label><input id="name" maxlength="16" placeholder="輸入你的遊戲名稱"><button id="joinBtn" class="primary" style="width:100%;margin-top:12px">加入遊戲</button><div id="joinMsg" class="err"></div></div>
<div id="game" class="hidden"><div class="card"><div class="info"><span class="pill">🎮 模式：<b id="mode">—</b></span><span class="pill">🔄 回合：<b id="round">—</b></span><span class="pill">📝 備註：<b id="note">無</b></span><span class="pill">🏆 排名：<b id="rank">—</b></span><span class="pill">⭐ 得分：<b id="score">0</b></span></div><div style="text-align:center;margin:8px 0">✨ ⭐ ✨</div><div class="phase" id="phase">等待開始</div><div class="timer" id="timer">—</div><div class="dice" id="dice"></div><div class="result" id="result"></div><div class="picked" id="picked">🎯 本回合已選：尚未提交</div><div class="gain" id="gain"></div><div id="answers" class="row" style="justify-content:center"></div><button id="submitBtn" class="primary" style="width:100%;margin-top:14px">✅ 確認答案</button><div id="feedback" style="text-align:center;font-weight:700;margin-top:10px"></div></div><div class="card"><h3 id="rankTitle">🏆 即時排行榜</h3><div class="ranking" id="ranking"></div></div></div></div>
<script src="/socket.io/socket.io.js"></script><script>
const socket=io(),$=id=>document.getElementById(id),ROOM=new URLSearchParams(location.search).get('room');let TOKEN=localStorage.getItem(`DGK_PLAYER_${ROOM}`)||'',NAME=localStorage.getItem(`DGK_PLAYER_NAME_${ROOM}`)||'',S=null,SELF=null,draft=null,draftRound=null,draftMode=null;
$('roomNo').textContent=ROOM||'------';if(!ROOM){$('joinMsg').textContent='此連結沒有房間號，請向主控取得最新玩家連結。';$('joinBtn').disabled=true}
function rankArray(){return [...(S?.players||[])].sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name))}
function me(){return S?.players.find(p=>p.name===NAME)}
function rankOf(){return rankArray().findIndex(p=>p.name===NAME)+1}
function fmtAnswer(a){
  if(a==null||a==='') return '尚未提交';
  return Array.isArray(a)?a.join(' ＞ '):String(a);
}
function updateLogin(){if(!S)return;const s=S.settings;$('loginMode').textContent=s.mode;$('loginRounds').textContent=`${s.totalRounds} 回`;$('loginStart').textContent=s.startAt?s.startAt.replace('T',' '):'尚未設定';$('loginNote').textContent=s.note||'無'}
function answerUI(p){const box=$('answers');box.innerHTML='';const can=S.status==='playing'&&S.phase==='玩家作答中'&&!p?.answered;$('submitBtn').style.display=can?'block':'none';if(!can)return;if(draftRound!==S.round||draftMode!==S.settings.mode){draft=S.settings.mode.startsWith('猜號碼')?Array(S.settings.diceCount).fill(null):null;draftRound=S.round;draftMode=S.settings.mode}function btn(v,label=v){const b=document.createElement('button');b.className='choice'+((Array.isArray(draft)?false:draft===v)?' sel':'');b.textContent=label;b.onclick=()=>{draft=v;answerUI(p)};box.appendChild(b)}if(S.settings.mode==='猜總點數'){for(let v=S.settings.diceCount;v<=S.settings.diceCount*6;v++)btn(v)}else if(S.settings.mode==='猜大小'){btn('大');btn('小')}else if(S.settings.mode==='猜單雙'){btn('單');btn('雙')}else{for(let i=0;i<S.settings.diceCount;i++){const w=document.createElement('div');w.style.width='100%';w.innerHTML=`<div style="text-align:center;font-weight:700">${i+1}. 選號</div>`;const r=document.createElement('div');r.className='row';r.style.justifyContent='center';for(let v=1;v<=6;v++){const b=document.createElement('button');b.className='choice'+(draft?.[i]===v?' sel':'');b.textContent=v;b.onclick=()=>{draft[i]=v;answerUI(p)};r.appendChild(b)}w.appendChild(r);box.appendChild(w)}}}
function render(full=true){
  updateLogin();
  if(!NAME)return;
  $('login').classList.add('hidden');
  $('game').classList.remove('hidden');
  const p=me();
  if(!p)return;
  $('mode').textContent=S.settings.mode;
  $('round').textContent=S.round?`第 ${S.round} / ${S.settings.totalRounds} 回`:`0 / ${S.settings.totalRounds}`;
  $('note').textContent=S.settings.note||'無';
  $('rank').textContent=rankOf()?`第 ${rankOf()} 名`:'—';
  $('score').textContent=SELF?.score ?? p.score;
  $('phase').textContent=S.paused?'⏸ 已暫停':S.phase;
  $('timer').textContent=S.remaining??'—';
  $('dice').innerHTML=(S.dice.length?S.dice:Array(S.settings.diceCount).fill('?')).map(v=>`<div class="die">${v}</div>`).join('');
  $('result').textContent=S.result?`🎉 ${S.result}`:'';

  let shownAnswer = SELF?.round===S.round ? SELF.answer : null;
  if(shownAnswer==null && draftRound===S.round && draft!=null) shownAnswer=draft;
  $('picked').textContent=`🎯 本回合已選：${fmtAnswer(shownAnswer)}`;

  if(S.phase==='公布答案' || S.status==='ended'){
    $('gain').textContent=SELF?.round===S.round ? `本回合 +${SELF.lastGain||0} 分｜目前 ${SELF.score??p.score} 分` : '';
    $('feedback').textContent='';
  }else if(SELF?.round===S.round && SELF.answered){
    $('gain').textContent='';
    $('feedback').textContent=`✅ 已提交：${fmtAnswer(SELF.answer)}`;
  }else{
    $('gain').textContent='';
    $('feedback').textContent='';
  }

  if(full)answerUI(p);
  const r=rankArray();
  $('rankTitle').textContent='🏆 即時排行榜';
  $('ranking').innerHTML=r.map((x,i)=>`<div class="item ${x.name===NAME?'you':''}"><span>${['🥇','🥈','🥉'][i]||''} ${i+1}　${x.name}${x.name===NAME?' 👤 你':''}</span><b>${x.score} 分</b></div>`).join('');
}
function peek(){if(!ROOM)return;socket.emit('player:peek',{room:ROOM},res=>{if(!res.ok){$('joinMsg').textContent=res.error;return}S=res.state;updateLogin();if(TOKEN&&NAME)join(true)})}function join(reconnect=false){const name=reconnect?NAME:$('name').value.trim();socket.emit('player:join',{room:ROOM,name,playerToken:TOKEN},res=>{if(!res.ok){if(reconnect){TOKEN='';NAME='';localStorage.removeItem(`DGK_PLAYER_${ROOM}`);localStorage.removeItem(`DGK_PLAYER_NAME_${ROOM}`)}$('joinMsg').textContent=res.error;return}TOKEN=res.playerToken;NAME=res.name;S=res.state;SELF=res.self||SELF;localStorage.setItem(`DGK_PLAYER_${ROOM}`,TOKEN);localStorage.setItem(`DGK_PLAYER_NAME_${ROOM}`,NAME);render()})}$('joinBtn').onclick=()=>join(false);$('submitBtn').onclick=()=>{const p=me();if(!p||p.answered)return;if(S.settings.mode.startsWith('猜號碼')&&(!Array.isArray(draft)||draft.some(v=>v==null)))return alert('請把每個號碼都選完');if(!S.settings.mode.startsWith('猜號碼')&&draft==null)return alert('請先選答案');socket.emit('player:submit',{room:ROOM,playerToken:TOKEN,answer:Array.isArray(draft)?[...draft]:draft},res=>{if(!res.ok)return alert(res.error);if(res.self)SELF=res.self;render(true)})};socket.on('player:self',self=>{if(self.room!==ROOM)return;SELF=self;render(false)});socket.on('room:state',st=>{if(st.room!==ROOM)return;const old=S;S=st;const structural=!old||old.round!==S.round||old.phase!==S.phase||old.status!==S.status||old.settings.mode!==S.settings.mode||JSON.stringify(old.players)!==JSON.stringify(S.players);render(structural)});peek();
</script></body></html>
