<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><link rel="stylesheet" href="style.css"><title>翻牌記憶王</title></head><body><div id="top" class="topbar hidden"><span>👑 翻牌記憶王</span><span>⭐ <b id="score">0</b>｜⏳ <b id="timer">--:--</b></span></div><main class="wrap"><section id="join" class="panel login"><div class="hero"><h1>👑 翻牌記憶王</h1><p>動動腦・找配對・成為記憶王！</p></div><label>房號<input id="room" placeholder="請使用主控分享的玩家網址" readonly></label><label>玩家名稱<input id="name" placeholder="請輸入你的名字" autocomplete="off"></label><button id="joinBtn">👤 加入遊戲</button><p id="msg" class="status"></p></section><section id="late" class="panel login hidden"><h2 id="lateMsg">比賽已開始</h2><p class="status">本局已停止新玩家加入。</p></section><section id="wait" class="panel hidden"><h2>🎴 已進入房間 <span id="roomShow"></span></h2><p class="status">等待主控開始遊戲…</p><p id="rules"></p></section><section id="game" class="hidden"><div id="board" class="board"></div></section><section id="result" class="panel hidden result"></section></main><div id="overlay" class="overlay hidden"></div><script src="/socket.io/socket.io.js"></script><script src="player.js"></script></body></html>
