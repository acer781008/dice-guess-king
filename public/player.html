<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><link rel="stylesheet" href="styles.css"><title>數字大亂鬥</title></head><body><div class="wrap">
<div id="joinCard" class="card login"><div class="title">數字大亂鬥</div><div id="roomDisplay" class="pill hidden" style="margin-top:10px"></div><div class="join-form" style="margin-top:10px"><div class="field" id="roomField"><label>房號</label><input id="roomInput" inputmode="numeric" maxlength="6"></div><div class="field"><label>玩家名稱</label><input id="nameInput" maxlength="10" placeholder="輸入玩家名即可"></div><div class="field hidden" id="teamChoiceField"><label>選擇隊伍</label><select id="teamChoice"><option value="red">🔴 紅隊</option><option value="blue">🔵 藍隊</option></select></div><button id="joinBtn" class="btn primary" style="width:100%">加入遊戲</button><p id="joinMsg" class="muted"></p></div></div>
<div id="game" class="hidden"><div class="top"><div><div class="title" id="gameTitle">數字大亂鬥</div><div class="muted small">房號 <span id="roomCode"></span> <span id="myTeam"></span></div></div><div class="actions"><button id="rulesBtn" class="btn copy">📖 遊戲規則</button><button id="soundBtn" class="btn">🔊 聲音</button></div></div>
<div class="hud" style="margin-top:8px"><div class="pill" id="roundPill">第 0 回合</div><div class="pill" id="timePill">⏱ --</div><div class="pill">⭐ <span id="myScore">0</span> 分</div><div class="pill">🔥 連勝 <span id="streakNum">0</span></div></div>
<div class="card game-card" style="margin-top:8px"><div id="modeName" style="font-weight:1000;font-size:18px">等待主控開始</div><div id="rule" class="rule muted">盤面已鎖定，開始倒數結束後才會揭露數字。</div><div id="target" style="font-size:30px;font-weight:1000;text-align:center;margin:8px 0"></div><div id="status" class="status"></div><div id="board" class="board"></div></div>
<div id="teamScore" class="team hidden" style="margin-top:8px"></div>
<section class="card" style="margin-top:8px"><b>排行榜</b><table class="lb"><thead><tr><th>#</th><th>玩家</th><th>分數</th><th>連勝</th><th>隊伍</th></tr></thead><tbody id="pRank"></tbody></table></section>
</div><div id="overlay" class="card countdown hidden"></div><div id="rulesModal" class="modal hidden"><div class="card rules-card"><div class="top"><div class="title">📖 遊戲規則</div><button id="rulesClose" class="btn">關閉</button></div><div id="rulesContent" class="rules-content"></div></div></div></div><script src="/socket.io/socket.io.js"></script><script src="player.js"></script></body></html>
