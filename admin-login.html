<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>翻牌記憶王｜主控登入</title></head><body><main class="wrap login"><div class="hero"><h1>👑 翻牌記憶王</h1><p>動動腦・找配對・成為記憶王！</p></div><section class="panel"><h2>🔐 主控登入</h2><input id="pw" type="password" placeholder="輸入主控密碼" autocomplete="current-password"><button id="loginBtn">進入主控室</button><p id="msg" class="status"></p></section></main><script>
const pw=document.getElementById('pw'),msg=document.getElementById('msg'),btn=document.getElementById('loginBtn');
async function login(){btn.disabled=true;msg.textContent='驗證中…';try{const r=await fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw.value})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.msg||'密碼錯誤');sessionStorage.mkAdminToken=d.token;location='admin.html'}catch(e){msg.textContent=e.message||'登入失敗';btn.disabled=false}}
btn.onclick=login;pw.addEventListener('keydown',e=>{if(e.key==='Enter')login()});
</script></body></html>
